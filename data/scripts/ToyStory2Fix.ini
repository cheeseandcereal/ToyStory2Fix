[ToyStory2Fix]
; Adjusts the games timing to attempt to fix framerate issues on newer computers.
FixFramerate = true

; Ignores the amount of VRAM when enumerating graphics processors. This fixes the "Unable to enumerate a suitable device" error.
IgnoreVRAM = true

; Allows the copyright and ESRB screens to be skipped immediately with Space/Jump.
SkipSplash = true

; Increases the render distance of the main level geometry to the maximum. Prevents areas of the level disappearing when they are far from the camera. Strongly recommended when using widescreen.
IncreaseRenderDistance = true

; Displays 3D graphics in the correct aspect-ratio when widescreen resolutions are selected.
Widescreen = true

; Fixes texture-mapping bugs.
TextureFix = true

; Fixes broken disk launcher at 60 FPS.
DiskFix = true

; Fixes fast Zurg and other flying enemies at 60 FPS.
ZurgFix = true

; Plays the helicopter cutscene when the lights puzzle is solved on each visit to Tarmac Trouble.
TarmacCutsceneFix = true

; Makes first-person Up look up and Down look down.
UninvertCamera = true

; Better controller support:
; * Control the camera with the right analog stick
; * Map Cancel to the laser button and Menu to Start by default
; * Map the D-pad to the directions by default, and allow binding it
; * Allow several actions to share a button or key in the controls menu
; * Allow using the controller in the controls menu
; * Close the pause menu with Cancel from its main page
EnhancedControllerSupport = true

; Starts in borderless fullscreen. Set to false for a resizable window.
Fullscreen = true

; Render resolution. auto uses the monitor's resolution.
; Recommend setting manually when not using fullscreen and/or to increase performance.
ResolutionWidth = auto
ResolutionHeight = auto
